name: 02-single-send-full-balance
description: Sender transfers entire balance to receiver
genesis:
  accounts:
    sender:
      balance: "1000000stake"
    receiver:
      balance: "500000stake"
blocks:
  - txs:
      - signer: sender
        msg: bank-send
        to: receiver
        amount: "1000000stake"
        gas: 200000
