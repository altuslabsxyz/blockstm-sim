name: 03-single-send-minimal
description: Sender transfers minimal 1stake to receiver
genesis:
  accounts:
    sender:
      balance: "1000000stake"
    receiver:
      balance: "500000stake"
blocks:
  - txs:
      - signer: sender
        msg: bank-send
        to: receiver
        amount: "1stake"
        gas: 200000
