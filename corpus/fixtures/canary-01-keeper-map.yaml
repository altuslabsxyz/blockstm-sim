name: canary-01-keeper-map
description: "C1: keeper in-memory map outside MVMemory causes stale read under BlockSTM"
kind: canary
genesis:
  accounts:
    alice:
      balance: "1000000stake"
    bob:
      balance: "1000000stake"
blocks:
  - txs:
      - signer: alice
        msg: canary-map-set
        key: "k"
        value: 42
        gas: 200000
      - signer: bob
        msg: canary-map-read-write
        key: "k"
        gas: 200000
