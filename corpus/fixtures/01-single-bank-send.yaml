name: 01-single-bank-send
description: Single signed MsgSend from a funded account
genesis:
  accounts:
    sender:
      balance: "1000000stake"
    receiver:
      balance: "500000stake"
blocks:
  - txs:
      - signer: sender
        msg: bank-send
        to: receiver
        amount: "100stake"
        gas: 200000
