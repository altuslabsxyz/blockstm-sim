name: canary-03-read-before-write
description: "C1: reader ordered before writer on same key in one block"
kind: canary
genesis:
  accounts:
    alice:
      balance: "1000000stake"
    bob:
      balance: "1000000stake"
blocks:
  - txs:
      - signer: alice
        msg: canary-map-read-write
        key: "k"
        gas: 200000
      - signer: bob
        msg: canary-map-set
        key: "k"
        value: 99
        gas: 200000
