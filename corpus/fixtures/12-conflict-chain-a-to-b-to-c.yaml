name: 12-conflict-chain-a-to-b-to-c
description: Chain transfer A->B->C in one block with B as contention point
genesis:
  accounts:
    alice:
      balance: "1000000stake"
    bob:
      balance: "1000000stake"
    carol:
      balance: "1000000stake"
blocks:
  - txs:
      - signer: alice
        msg: bank-send
        to: bob
        amount: "100stake"
        gas: 200000
      - signer: bob
        msg: bank-send
        to: carol
        amount: "100stake"
        gas: 200000
