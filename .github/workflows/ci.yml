name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Configure modules for CI
        run: |
          go mod edit -dropreplace github.com/cosmos/cosmos-sdk
          go mod edit -dropreplace github.com/cometbft/cometbft
          go mod edit -dropreplace cosmossdk.io/store
          go mod edit -require github.com/cosmos/cosmos-sdk@v0.50.13
          # These packages require the stable-sdk fork; skip until upstream merge
          rm -rf instrument/ compare/ run/ x/ cmd/ report/ recorder/
          go mod tidy

      - name: Run linter
        uses: golangci/golangci-lint-action@v7

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Configure modules for CI
        run: |
          go mod edit -dropreplace github.com/cosmos/cosmos-sdk
          go mod edit -dropreplace github.com/cometbft/cometbft
          go mod edit -dropreplace cosmossdk.io/store
          go mod edit -require github.com/cosmos/cosmos-sdk@v0.50.13
          # These packages require the stable-sdk fork; skip until upstream merge
          rm -rf instrument/ compare/ run/ x/ cmd/ report/ recorder/
          go mod tidy

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
