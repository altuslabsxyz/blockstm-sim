name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Configure modules for CI
        run: |
          go mod edit -dropreplace github.com/cosmos/cosmos-sdk
          go mod edit -dropreplace github.com/cometbft/cometbft
          go mod edit -require github.com/cosmos/cosmos-sdk@v0.50.13
          # instrument/ requires stable-sdk fork; skip until upstream merge
          rm -rf instrument/
          go mod tidy

      - name: Run linter
        uses: golangci/golangci-lint-action@v7

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Configure modules for CI
        run: |
          go mod edit -dropreplace github.com/cosmos/cosmos-sdk
          go mod edit -dropreplace github.com/cometbft/cometbft
          go mod edit -require github.com/cosmos/cosmos-sdk@v0.50.13
          # instrument/ requires stable-sdk fork; skip until upstream merge
          rm -rf instrument/
          go mod tidy

      - name: Build (default)
        run: go build ./...

      - name: Build (simharness)
        run: go build -tags simharness ./...

      - name: Build (simharness + canary)
        run: go build -tags "simharness simharness_canary" ./...

      - name: Test
        run: go test ./...

      - name: Verify version command
        run: |
          go build -o blockstm-sim ./cmd/blockstm-sim
          ./blockstm-sim version
