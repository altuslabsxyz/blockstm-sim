name: Bug Report
description: Report a reproducible bug in blockstm-sim
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `make run` with ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: build_tag
    attributes:
      label: Build Tag (execution mode)
      description: Which F-mode were you using?
      options:
        - f1
        - f2
        - f3
        - none / not applicable
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: Go Version
      placeholder: "go version go1.23.0 darwin/arm64"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Architecture
      placeholder: "macOS 15.0 arm64"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Output
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: "`make test` fails or produces unexpected output with this bug"
